name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Each step saves its output and, on failure, reports the last lines as an
      # annotation, so the reason for a failure is visible without opening the job log.
      - name: Install
        run: |
          set -o pipefail
          npm install --legacy-peer-deps 2>&1 | tee ../install.log || {
            msg=$(tail -n 60 ../install.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=npm install failed::$msg"
            exit 1
          }
      - name: Build
        env:
          CI: "false"
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ../build.log || {
            msg=$(tail -n 60 ../build.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=build failed::$msg"
            exit 1
          }
